name: Fase 1 - Seleccion de partidos

# Ventana 04:00-06:00 hora local (UTC-5) = 09:00-11:00 UTC.
# Reintenta cada 5 min dentro de la ventana hasta lograrlo -- si ya se
# completo hoy, seleccionar_partidos.py termina de inmediato sin gastar
# ninguna peticion (ver ya_se_completo_hoy() en el script).
on:
  schedule:
    - cron: "*/5 9-10 * * *"
  workflow_dispatch: {}

concurrency:
  group: fase1-seleccion
  cancel-in-progress: false

jobs:
  seleccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar seleccion de partidos
        run: python seleccionar_partidos.py

      - name: Commit y push (con reintento
